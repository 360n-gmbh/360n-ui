# HINWEIS: Diese Datei gehoert nach .github/workflows/publish.yml.
# Der CLI-Token dieser Session hatte keinen workflow-Scope, daher liegt sie
# hier geparkt. Verschieben: im GitHub-Web-UI anlegen oder lokal
# `gh auth refresh -s workflow`, dann `git mv` und pushen.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@360n-gmbh"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typen prüfen
        run: npx tsc --noEmit

      - name: Nach GitHub Packages veröffentlichen
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
